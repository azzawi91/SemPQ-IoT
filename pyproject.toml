[project]
name = "sempq-iot"
version = "0.0.1"
description = "SemPQ-IoT v5: semantic ECG encoder, PQ-Lite handshake, threat-aware Lyapunov scheduler (simulation code)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "hydra-core",
    "omegaconf",
    "wfdb",
    "cryptography",
    "liboqs-python",
    "pyyaml",
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs PhysioNet access (skipped unless SEMPQ_NETWORK=1)",
    "liboqs: test needs the liboqs C library",
]
